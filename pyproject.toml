[project]
name = "funstock"
version = "0.2.10"
description = "funstock"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "baostock>=0.8.9",
    "farlog>=1.1.8",
    "funtable>=1.0.46",
    "pandas>=2.0",
    "pyecharts>=2.0",
    "pymysql>=1.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "tushare>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funstock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
