[project]
name = "funstock"
version = "0.2.10"
description = "A股行情数据工具包：基于 tushare/baostock 抓取日线与 1/5/15/30/60 分钟行情并落地 SQLite，附 pyecharts 日K线绘图"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "baostock>=0.8.9",
    "farlog>=1.1.8",
    "funtable>=1.0.46",
    "pandas>=2.0",
    "pyecharts>=2.0",
    "pymysql>=1.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "tushare>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funstock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# farlog 用 `{}` 做参数化日志（类似 loguru），ruff 按 stdlib logging 的 `%s` 语法误报
# PLE1205（参数过多），这是组织内已知的误报，不要改回 f-string（见 todo-list#695）。
ignore = ["PLE1205"]
